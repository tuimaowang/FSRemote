<svg width="16" height="16" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fGradient" x1="48" y1="48" x2="124" y2="208" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E88FF"/>
      <stop offset="1" stop-color="#36A8FF"/>
    </linearGradient>
    <linearGradient id="sGradient" x1="132" y1="48" x2="208" y2="208" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20D3B0"/>
      <stop offset="1" stop-color="#00CFFF"/>
    </linearGradient>
  </defs>

  <!-- =====wjy==== -->
  <g transform="rotate(45 128 128)" stroke="#073DAF" stroke-width="6" stroke-linejoin="miter" paint-order="stroke fill">
    <!-- wjy: F 使用七十六单位宽度，两条横线之间形成六十乘六十的标准正方形区域。 -->
    <path fill="url(#fGradient)" d="M48 48H124V64H64V124H124V140H64V208H48V48Z"/>
    <!-- wjy: 实心方块为四十四乘四十四，与 F 四边均保持八单位间距，并使用相同描边宽度保证视觉间距一致。 -->
    <rect x="72" y="72" width="44" height="44" fill="url(#fGradient)" stroke="#073DAF" stroke-width="6"/>
    <!-- wjy: S 同样使用七十六单位宽度，并与 F 保持八单位间距。 -->
    <path fill="url(#sGradient)" d="M132 48H208V64H148V124H208V208H132V192H192V140H132V48Z"/>
  </g>
  <!-- ===end==== -->
</svg>
